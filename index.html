  font: 11px/1 system-ui, sans-serif;

}

    transition: none !important;
    animation: none !important;
    box-shadow: none !important;

<script>
(function () {
    function markEditable() {
        document.body.classList.add('artifact-editable');
    }

    function initChromeUI() {
        if (!matchMedia('(hover: hover)').matches) return;

        var credit = document.createElement('div');
        credit.className = 'design-ui-credit';
        credit.setAttribute('aria-hidden', 'true');
        credit.innerHTML = '\u{1F49C} by ClickUp Brain';
        document.body.appendChild(credit);

        var timer = null;
        var fade = function (out) { credit.style.opacity = out ? '0' : ''; };
        fade(true);
        var show = function () {
            fade(false);
            clearTimeout(timer);
            timer = setTimeout(function () { fade(true); }, 3000);
        };
        document.addEventListener('mousemove', show);
        show();
    }

    function init() {
        markEditable();
        initChromeUI();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iron Ledger · Training Log</title>
<meta name="description" content="A strength training log with a built-in Gemini coach that reads your sets, notes and PRs.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --ink-0:oklch(0.148 0.008 62);
  --ink-1:oklch(0.188 0.009 62);
  --ink-2:oklch(0.232 0.010 62);
  --ink-3:oklch(0.285 0.012 62);
  --line:oklch(0.315 0.012 62);
  --line-soft:oklch(0.252 0.010 62);

  --text:oklch(0.945 0.012 74);
  --text-2:oklch(0.745 0.014 70);
  --text-3:oklch(0.575 0.014 66);

  --ember:oklch(0.685 0.175 42);
  --ember-dim:oklch(0.545 0.135 42);
  --ember-wash:oklch(0.268 0.055 42);
  --ember-ink:oklch(0.795 0.135 52);

  --jade:oklch(0.735 0.115 168);
  --jade-wash:oklch(0.272 0.045 168);
  --gold:oklch(0.845 0.135 88);
  --gold-wash:oklch(0.288 0.055 88);

  --r-sm:8px; --r-md:12px; --r-lg:18px;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px;
  --s-5:24px; --s-6:32px; --s-7:48px; --s-8:72px;

  --exp:cubic-bezier(0.16,1,0.3,1);
  --quart:cubic-bezier(0.25,1,0.5,1);

  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;

  --panel:oklch(0.188 0.009 62 / 0.86);
  --panel-2:oklch(0.232 0.010 62 / 0.9);
}

html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  background:var(--ink-0);
  color:var(--text);
  font-family:var(--sans);
  font-size:16px; font-weight:400;
  line-height:1.55; letter-spacing:0.008em;
  font-optical-sizing:auto;
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;
}
h1,h2,h3,h4{overflow-wrap:anywhere;text-wrap:balance;line-height:1.12;letter-spacing:-0.015em}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ember-ink);outline-offset:2px;border-radius:4px}
::selection{background:var(--ember-wash);color:var(--text)}

#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-2;display:block}
#grain{
  position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:radial-gradient(oklch(1 0 0 / .022) 1px, transparent 1px);
  background-size:3px 3px;
  mix-blend-mode:overlay;
}
#cursor-glow{
  position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.48;
  background:radial-gradient(420px circle at var(--pointer-x,50%) var(--pointer-y,28%),rgba(235,115,58,.12),transparent 68%);
  transition:opacity .45s ease;
}

.display{font-weight:800;font-stretch:114%;text-transform:uppercase;letter-spacing:-0.01em}
.eyebrow{font-size:0.6875rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-3)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--ink-3);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:var(--line)}

.shell{max-width:1360px;margin:0 auto;padding:var(--s-5) var(--s-5) var(--s-8);position:relative}
@media(max-width:720px){.shell{padding:var(--s-4) var(--s-4) 96px}}

.top{
  display:grid;gap:var(--s-5);
  grid-template-columns:minmax(0,1fr) auto;align-items:end;
  padding-bottom:var(--s-4);border-bottom:1px solid var(--line-soft);margin-bottom:var(--s-5);
}
@media(max-width:900px){.top{grid-template-columns:1fr;align-items:start}}

.brand{display:flex;align-items:center;gap:var(--s-3)}
.mark{
  width:38px;height:38px;flex:none;border-radius:11px;
  background:var(--ember);color:oklch(0.16 0.03 42);
  display:grid;place-items:center;font-weight:800;font-size:1.05rem;font-stretch:118%;
  position:relative;
  box-shadow:0 0 0 0 rgba(232,112,58,0);
  transition:transform .35s var(--exp),box-shadow .35s ease;
}
.brand:hover .mark{transform:rotate(-4deg) scale(1.06);box-shadow:0 12px 34px rgba(232,112,58,.2)}
.mark::after{
  content:"";position:absolute;inset:-5px;border-radius:15px;
  border:1px solid var(--ember-dim);opacity:0;
  animation:pulse 4.5s var(--quart) infinite;
}
@keyframes pulse{0%{opacity:.55;transform:scale(.92)}60%,100%{opacity:0;transform:scale(1.18)}}
.brand h1{font-size:1.5rem}
.brand .tag{font-size:0.75rem;color:var(--text-3);letter-spacing:0.06em;text-transform:uppercase;font-weight:600}

.meta{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--s-2) var(--s-4);margin-top:var(--s-4);font-size:0.875rem;color:var(--text-2)}
.meta b{font-family:var(--mono);font-weight:600;color:var(--text);font-size:0.95rem}
.meta .sep{color:var(--ink-3)}
.meta .hot b{color:var(--ember-ink)}

.heat-wrap{display:flex;flex-direction:column;gap:var(--s-2);align-items:flex-end}
@media(max-width:900px){.heat-wrap{align-items:flex-start}}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,9px);gap:3px}
.heat i{
  width:9px;height:9px;border-radius:2px;background:oklch(0.188 0.009 62 / .8);display:block;
  animation:cellIn .5s var(--exp) backwards;animation-delay:calc(var(--i)*3ms);
}
.heat i.t1{background:var(--ember-wash)}
.heat i.t2{background:var(--ember-dim)}
.heat i.t3{background:var(--ember)}
.heat i.today{box-shadow:0 0 0 1.5px var(--text-3)}
@keyframes cellIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.heat-key{display:flex;gap:6px;align-items:center;font-size:0.6875rem;color:var(--text-3);letter-spacing:0.04em}
.heat-key i{width:9px;height:9px;border-radius:2px;display:block}
.heat-key .level-0{background:rgba(32,29,27,.8)}
.heat-key .level-1{background:var(--ember-wash)}
.heat-key .level-2{background:var(--ember-dim)}
.heat-key .level-3{background:var(--ember)}
.day-actions,.data-actions{display:flex;gap:8px}
.data-actions{justify-content:center;padding-bottom:8px}
.quiet-note{font-size:.75rem;color:var(--text-3)}
.session-clock{font-size:.8125rem;color:var(--text-3)}

.board{display:grid;grid-template-columns:minmax(0,1fr) 384px;gap:var(--s-6);align-items:start}
@media(max-width:1120px){.board{grid-template-columns:1fr;gap:var(--s-6)}}

.daybar{display:flex;gap:var(--s-2);margin-bottom:var(--s-5);flex-wrap:wrap}
.day-t{
  flex:1 1 140px;text-align:left;padding:11px 14px;border-radius:var(--r-md);
  border:1px solid var(--line-soft);background:var(--panel);
  transition:background .18s var(--quart),border-color .18s var(--quart),transform .18s var(--quart);
  display:flex;align-items:center;gap:10px;
}
.day-t:hover{background:var(--panel-2);border-color:var(--line)}
.day-t:active{transform:translateY(1px)}
.day-t .k{
  font-family:var(--mono);font-size:0.75rem;font-weight:600;
  width:22px;height:22px;border-radius:6px;flex:none;display:grid;place-items:center;
  background:var(--ink-3);color:var(--text-2);transition:background .18s var(--quart),color .18s var(--quart);
}
.day-t .n{font-weight:600;font-size:0.9375rem;line-height:1.2}
.day-t .s{font-size:0.75rem;color:var(--text-3);line-height:1.3}
.day-t[aria-selected="true"]{background:var(--ember-wash);border-color:var(--ember-dim)}
.day-t[aria-selected="true"] .k{background:var(--ember);color:oklch(0.18 0.03 42)}
.day-t .badge{margin-left:auto;font-size:0.625rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--jade)}

.dayhead{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s-4);flex-wrap:wrap;margin-bottom:var(--s-3)}
.dayhead h2{font-size:clamp(1.65rem,4vw,2.15rem);font-weight:800;font-stretch:112%;text-transform:uppercase}
.dayhead .focus{color:var(--text-3);font-size:0.875rem;margin-top:2px}

.prep{display:flex;gap:var(--s-2);flex-wrap:wrap;margin-bottom:var(--s-5)}
.prep details{flex:1 1 260px;background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r-md);overflow:hidden}
.prep summary{list-style:none;cursor:pointer;padding:10px 14px;font-size:0.8125rem;font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:8px}
.prep summary::-webkit-details-marker{display:none}
.prep summary::after{content:"+";margin-left:auto;color:var(--text-3);font-family:var(--mono)}
.prep details[open] summary::after{content:"−"}
.prep summary:hover{color:var(--text)}
.prep ol{list-style:none;padding:0 14px 12px;display:grid;gap:5px;counter-reset:li}
.prep li{font-size:0.8125rem;color:var(--text-3);display:flex;gap:8px}
.prep li::before{content:counter(li,decimal-leading-zero);counter-increment:li;font-family:var(--mono);font-size:0.6875rem;color:var(--ink-3);padding-top:2px}

.block-label{display:flex;align-items:center;gap:var(--s-3);margin:var(--s-6) 0 var(--s-3)}
.block-label:first-of-type{margin-top:var(--s-2)}
.block-label::after{content:"";flex:1;height:1px;background:var(--line-soft)}

.ex{border-top:1px solid var(--line-soft);animation:rowIn .55s var(--exp) backwards;animation-delay:calc(var(--i)*40ms)}
.ex:last-child{border-bottom:1px solid var(--line-soft)}
@keyframes rowIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.ex-head{
  width:100%;display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;
  align-items:center;gap:var(--s-3);padding:13px 10px 13px 4px;text-align:left;
  transition:background .16s var(--quart);border-radius:var(--r-sm);
}
.ex-head:hover{background:var(--panel)}
.ex.done .ex-name{color:var(--text-2)}

.ring{width:30px;height:30px;position:relative;flex:none}
.ring svg{transform:rotate(-90deg);display:block}
.ring circle{fill:none;stroke-width:2.5}
.ring .bg{stroke:var(--ink-3)}
.ring .fg{stroke:var(--ember);stroke-linecap:round;transition:stroke-dashoffset .5s var(--exp),stroke .3s}
.ex.done .ring .fg{stroke:var(--jade)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:0.625rem;font-weight:600;color:var(--text-3)}
.ex.done .ring b{color:var(--jade)}

.ex-name{font-weight:600;font-size:1rem;letter-spacing:-0.005em}
.ex-sub{font-size:0.8125rem;color:var(--text-3);display:flex;flex-wrap:wrap;gap:0 8px}
.ex-sub .prev{color:var(--ember-ink);font-family:var(--mono);font-size:0.75rem}
.pr-chip{font-family:var(--mono);font-size:0.6875rem;font-weight:600;color:var(--gold);background:var(--gold-wash);padding:3px 8px;border-radius:6px;white-space:nowrap}
.chev{color:var(--text-3);transition:transform .3s var(--exp);display:grid;place-items:center}
.ex[open-body] .chev{transform:rotate(180deg)}

.ex-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--exp)}
.ex[open-body] .ex-body{grid-template-rows:1fr}
.ex-body>div{overflow:hidden}
.ex-inner{padding:2px 10px 20px 48px}
@media(max-width:640px){.ex-inner{padding-left:8px}}

.sets{display:grid;gap:6px}
.set{display:grid;align-items:center;gap:8px;grid-template-columns:20px 84px 78px minmax(0,1fr) 34px}
@media(max-width:520px){.set{grid-template-columns:18px 1fr 1fr 34px}.set .hint{display:none}}
.set .sn{font-family:var(--mono);font-size:0.75rem;color:var(--text-3)}
.field{position:relative;display:flex;align-items:center}
.field input{
  width:100%;background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r-sm);
  padding:8px 30px 8px 10px;font-family:var(--mono);font-size:0.9375rem;font-weight:500;
  transition:border-color .16s,background .16s;appearance:textfield;-moz-appearance:textfield;
}
.field input::-webkit-inner-spin-button{-webkit-appearance:none;appearance:none}
.field input::placeholder{color:var(--ink-3)}
.field input:hover{background:var(--panel-2)}
.field input:focus{outline:none;border-color:var(--ember);background:var(--panel-2)}
.field .unit{position:absolute;right:9px;font-size:0.6875rem;color:var(--text-3);pointer-events:none;font-family:var(--mono)}
.set .hint{font-size:0.75rem;color:var(--text-3);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set .hint.up{color:var(--jade)}
.tick{
  width:32px;height:32px;border-radius:9px;border:1px solid var(--line);
  display:grid;place-items:center;color:var(--text-3);
  transition:transform .2s var(--quart),background .2s,border-color .2s,color .2s;
}
.tick:hover{border-color:var(--text-3);color:var(--text-2)}
.tick[aria-pressed="true"]{background:var(--jade);border-color:var(--jade);color:oklch(0.2 0.04 168)}
.tick.pop{animation:pop .34s var(--quart)}
@keyframes pop{0%{transform:scale(1)}42%{transform:scale(1.22)}100%{transform:scale(1)}}

.ex-foot{
  display:flex;align-items:center;gap:var(--s-4);flex-wrap:wrap;
  margin-top:12px;padding-top:10px;border-top:1px solid var(--line-soft);font-size:0.75rem;color:var(--text-3);
}
.ex-foot .vol{font-family:var(--mono);color:var(--text-2)}
.ex-foot button{font-size:0.75rem;color:var(--text-3);font-weight:600;transition:color .16s}
.ex-foot button:hover{color:var(--ember-ink)}
.spark{margin-left:auto;display:flex;align-items:center;gap:7px}
.spark svg{display:block;overflow:visible}
.spark .lbl{font-family:var(--mono);font-size:0.6875rem}

.notes{margin-top:var(--s-6)}
.notes textarea{
  width:100%;min-height:96px;resize:vertical;background:var(--panel);
  border:1px solid var(--line-soft);border-radius:var(--r-md);
  padding:13px 15px;font-size:0.9375rem;line-height:1.6;color:var(--text);
  transition:border-color .16s,background .16s;
}
.notes textarea::placeholder{color:var(--text-3)}
.notes textarea:focus{outline:none;border-color:var(--ember-dim);background:var(--panel-2)}
.notes .row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.notes .saved{font-size:0.75rem;color:var(--text-3);opacity:0;transition:opacity .3s}
.notes .saved.on{opacity:1}

.rail{position:static;display:grid;gap:var(--s-4);min-width:0}

.panel{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r-lg);overflow:hidden;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:transform .3s var(--exp),border-color .3s ease,box-shadow .3s ease}
@media(hover:hover){.panel:hover{transform:translateY(-2px);border-color:var(--line);box-shadow:0 18px 42px rgba(0,0,0,.16)}}
.panel-head{display:flex;align-items:center;gap:var(--s-2);padding:13px 16px;border-bottom:1px solid var(--line-soft)}
.panel-head h3{font-size:0.8125rem;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:var(--text-2)}
.panel-head .right{margin-left:auto;display:flex;align-items:center;gap:8px}

.timer{display:none;align-items:center;gap:14px;padding:14px 16px;background:var(--ember-wash);border:1px solid var(--ember-dim);border-radius:var(--r-lg)}
.timer.on{display:flex}
.timer-ring{width:44px;height:44px;position:relative;flex:none}
.timer-ring svg{transform:rotate(-90deg)}
.timer-ring circle{fill:none;stroke-width:3}
.timer-ring .bg{stroke:oklch(0.36 0.06 42)}
.timer-ring .fg{stroke:var(--ember);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.timer .t{font-family:var(--mono);font-size:1.35rem;font-weight:600;line-height:1}
.timer .lbl{font-size:0.75rem;color:var(--ember-ink);letter-spacing:0.05em;text-transform:uppercase;font-weight:600}
.timer .acts{margin-left:auto;display:flex;gap:6px}

.mini{padding:6px 11px;border-radius:8px;border:1px solid var(--line);font-size:0.75rem;font-weight:600;color:var(--text-2);transition:background .16s,border-color .16s,color .16s}
.mini:hover{background:var(--panel-2);color:var(--text)}
.mini.solid{background:var(--ember);border-color:var(--ember);color:oklch(0.18 0.03 42)}
.mini.solid:hover{background:var(--ember-ink);color:oklch(0.18 0.03 42)}
.mini.ghost{border-color:transparent;color:var(--text-3)}
.mini.ghost:hover{border-color:var(--line);color:var(--text)}

.sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line-soft)}
.sum-grid div{background:oklch(0.188 0.009 62 / .55);padding:13px 14px}
.sum-grid .v{font-family:var(--mono);font-size:1.15rem;font-weight:600}
.sum-grid .l{font-size:0.6875rem;color:var(--text-3);letter-spacing:0.07em;text-transform:uppercase;margin-top:1px}

.coach{
  display:flex;flex-direction:column;min-height:0;min-width:0;
  height:clamp(420px,calc(100vh - 48px),720px);
  height:clamp(420px,calc(100dvh - 48px),720px);
  max-height:calc(100vh - 48px);
  max-height:calc(100dvh - 48px);
  overscroll-behavior:contain;
}
.coach>.panel-head{flex:0 0 auto}
#tab-chat{min-height:0;min-width:0}
#tab-chat:not([hidden]){
  display:flex;flex:1 1 0;flex-direction:column;
  min-height:0;overflow:hidden;
}
#tab-signals,#tab-setup{min-height:0;min-width:0}
#tab-signals:not([hidden]),#tab-setup:not([hidden]){
  flex:1 1 0;overflow-y:auto;overflow-x:hidden;
  overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;
  touch-action:pan-y;
}
@media(min-width:1121px){
  .coach{position:sticky;top:var(--s-5)}
}
.coach-tabs{display:flex;gap:2px;margin-left:auto}
.coach-tabs button{font-size:0.75rem;font-weight:600;padding:5px 10px;border-radius:7px;color:var(--text-3);transition:background .16s,color .16s}
.coach-tabs button:hover{color:var(--text)}
.coach-tabs button[aria-selected="true"]{background:var(--ink-3);color:var(--text)}
.dot{width:6px;height:6px;border-radius:99px;background:var(--text-3)}
.dot.live{background:var(--jade);box-shadow:0 0 0 3px var(--jade-wash)}
.dot.armed{background:var(--ember);box-shadow:0 0 0 3px var(--ember-wash)}

.stream{
  padding:16px;display:flex;flex:1 1 0;flex-direction:column;gap:14px;
  width:100%;height:auto;min-height:0;max-height:none;
  overflow-y:scroll;overflow-x:hidden;
  overscroll-behavior-y:contain;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-y;
  scrollbar-gutter:stable;
  overflow-anchor:none;
  will-change:scroll-position;
}
@media(max-width:1120px){
  .coach{
    position:relative;
    height:calc(100vh - 24px);
    height:calc(var(--viewport-h, 100dvh) - 24px);
    min-height:min(420px,calc(100vh - 24px));
    min-height:min(420px,calc(var(--viewport-h,100dvh) - 24px));
    max-height:calc(100vh - 24px);
    max-height:calc(var(--viewport-h, 100dvh) - 24px);
    scroll-margin-top:12px;
  }
  .chips{
    flex:0 0 auto;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto}
  .composer{
    flex:0 0 auto;background:var(--panel);
    padding-bottom:max(12px,env(safe-area-inset-bottom));
  }
}

.msg{font-size:0.9rem;line-height:1.62;max-width:70ch}
.msg.me{align-self:flex-end;background:var(--ink-3);padding:9px 13px;border-radius:14px 14px 4px 14px;max-width:88%}
.msg.ai{color:var(--text-2)}
.msg.ai strong{color:var(--text);font-weight:600}
.msg.ai h4{font-size:0.8125rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-3);margin:12px 0 4px}
.msg.ai ul,.msg.ai ol{margin:6px 0 6px 2px;display:grid;gap:4px;list-style:none}
.msg.ai li{display:flex;gap:9px}
.msg.ai li::before{content:"▸";color:var(--ember);font-size:0.75rem;line-height:1.7}
.msg.ai ol{counter-reset:o}
.msg.ai ol li::before{content:counter(o);counter-increment:o;font-family:var(--mono);font-size:0.7rem;color:var(--ember);line-height:1.9}
.msg.ai code{font-family:var(--mono);font-size:0.85em;background:var(--ink-2);padding:1px 5px;border-radius:4px;color:var(--ember-ink)}
.msg.ai p+p{margin-top:8px}
.msg .who{font-size:0.6875rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-3);font-weight:700;margin-bottom:5px}

.typing{display:flex;gap:4px;padding:4px 0}
.typing i{width:5px;height:5px;border-radius:99px;background:var(--text-3);animation:blip 1.1s var(--quart) infinite}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes blip{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

.proposal{border:1px solid var(--gold);background:var(--gold-wash);border-radius:var(--r-md);padding:13px 14px}
.proposal h5{font-size:0.6875rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.proposal ul{list-style:none;display:grid;gap:6px;font-size:0.8125rem;color:var(--text)}
.proposal li{display:flex;gap:8px}
.proposal li::before{content:"↳";color:var(--gold);font-family:var(--mono)}
.proposal .acts{display:flex;gap:8px;margin-top:12px}

.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 12px}
.chip{font-size:0.75rem;font-weight:500;padding:6px 11px;border-radius:99px;border:1px solid var(--line);color:var(--text-2);transition:background .16s,border-color .16s,color .16s,transform .16s var(--quart)}
.chip:hover{background:var(--panel-2);border-color:var(--text-3);color:var(--text)}
.chip:active{transform:translateY(1px)}

.composer{display:flex;gap:8px;align-items:flex-end;padding:12px 14px;border-top:1px solid var(--line-soft)}
.composer textarea{
  flex:1;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:12px;
  padding:10px 13px;font-size:0.9rem;line-height:1.5;resize:none;max-height:130px;min-height:42px;transition:border-color .16s;
}
.composer textarea:focus{outline:none;border-color:var(--ember-dim)}
.composer textarea::placeholder{color:var(--text-3)}
.send{width:42px;height:42px;flex:none;border-radius:12px;background:var(--ember);color:oklch(0.18 0.03 42);display:grid;place-items:center;transition:background .16s,transform .16s var(--quart),opacity .16s}
.send:hover{background:var(--ember-ink)}
.send:active{transform:scale(.94)}
.send:disabled{opacity:.4;cursor:not-allowed}

.signals{display:grid}
.sig{padding:13px 16px;border-bottom:1px solid var(--line-soft);display:grid;gap:3px}
.sig:last-child{border-bottom:0}
.sig .t{display:flex;align-items:center;gap:8px;font-size:0.875rem;font-weight:600}
.sig .t .kind{font-family:var(--mono);font-size:0.625rem;font-weight:600;letter-spacing:.05em;padding:2px 6px;border-radius:5px;text-transform:uppercase}
.kind.up{background:var(--jade-wash);color:var(--jade)}
.kind.hold{background:var(--gold-wash);color:var(--gold)}
.kind.warn{background:var(--ember-wash);color:var(--ember-ink)}
.kind.info{background:var(--ink-3);color:var(--text-2)}
.sig .d{font-size:0.8125rem;color:var(--text-3);line-height:1.5}
.sig .d b{font-family:var(--mono);color:var(--text-2);font-weight:500}
.sig .go{justify-self:start;margin-top:5px}

.recs{display:grid}
.rec{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line-soft)}
.rec:last-child{border-bottom:0}
.rec .n{font-size:0.875rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec .w{font-family:var(--mono);font-size:1rem;font-weight:600;color:var(--gold);text-align:right}
.rec .d{font-size:0.6875rem;color:var(--text-3);grid-column:1}
.rec .e{font-family:var(--mono);font-size:0.6875rem;color:var(--text-3);text-align:right}

.empty{padding:22px 18px;text-align:center;color:var(--text-3);font-size:0.875rem;line-height:1.6}
.empty strong{display:block;color:var(--text-2);font-weight:600;margin-bottom:4px;font-size:0.9375rem}
.empty .mini{margin-top:12px}

.setup{padding:16px;display:grid;gap:12px}
.setup label{display:grid;gap:5px}
.setup .lb{font-size:0.6875rem;letter-spacing:0.09em;text-transform:uppercase;color:var(--text-3);font-weight:700}
.setup input,.setup select{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:99px;padding:9px 11px;font-size:0.875rem;font-family:var(--mono);width:100%}
.setup input:focus,.setup select:focus{outline:none;border-color:var(--ember-dim)}
.setup .fine{font-size:0.75rem;color:var(--text-3);line-height:1.55}
.setup .fine a{color:var(--ember-ink)}
.setup details summary{cursor:pointer;font-size:0.75rem;color:var(--text-3);font-weight:600}
.setup details summary:hover{color:var(--text-2)}
.setup pre{margin-top:8px;background:oklch(0.128 0.008 62);border:1px solid var(--line-soft);border-radius:9px;padding:11px;font-family:var(--mono);font-size:0.6875rem;line-height:1.55;color:var(--text-2);overflow-x:auto;max-height:210px}
.keystate{display:flex;align-items:center;gap:8px;font-size:0.8125rem;padding:9px 11px;border-radius:9px;border:1px solid var(--line-soft);background:var(--panel-2)}
.keystate.good{border-color:var(--jade);color:var(--jade)}
.keystate.warnk{border-color:var(--gold);color:var(--gold)}

.fab{display:none;position:fixed;right:16px;bottom:16px;z-index:40;padding:13px 18px;border-radius:99px;background:var(--ember);color:oklch(0.18 0.03 42);font-weight:700;font-size:0.875rem;align-items:center;gap:8px}
@media(max-width:1120px){.fab{display:flex}}

.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:60;display:grid;gap:8px;justify-items:center;pointer-events:none;padding:0 12px}
.toast{background:var(--ink-2);border:1px solid var(--line);border-radius:11px;padding:11px 17px;font-size:0.875rem;font-weight:500;animation:toastIn .4s var(--exp)}
.toast.win{border-color:var(--gold);color:var(--gold)}
.toast.ok{border-color:var(--jade);color:var(--jade)}
.toast.bad{border-color:var(--ember);color:var(--ember-ink)}
.toast.out{animation:toastOut .25s cubic-bezier(0.7,0,0.84,0) forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px) scale(.97)}}

dialog{border:1px solid var(--line);background:var(--ink-1);color:var(--text);border-radius:var(--r-lg);padding:0;max-width:460px;width:calc(100% - 32px)}
dialog::backdrop{background:oklch(0.1 0.01 62 / 0.72)}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<canvas id="bg" role="presentation"></canvas>
<div id="grain" aria-hidden="true"></div>
<div id="cursor-glow" aria-hidden="true"></div>

<div class="shell">

  <header class="top">
    <div>
      <div class="brand">
        <div class="mark">IL</div>
        <div>
          <h1 class="display">Iron Ledger</h1>
          <div class="tag" id="next-up">loading</div>
        </div>
      </div>
      <div class="meta" id="meta"></div>
    </div>
    <div class="heat-wrap">
      <div class="heat" id="heat" aria-label="Training history, last 12 weeks"></div>
      <div class="heat-key">
        <span>12 weeks</span>
        <i class="level-0"></i>
        <i class="level-1"></i>
        <i class="level-2"></i>
        <i class="level-3"></i>
        <span>volume</span>
      </div>
    </div>
  </header>

  <div class="board">
    <section>
      <div class="daybar" role="tablist" id="daybar"></div>

      <div class="dayhead">
        <div>
          <div class="eyebrow" id="day-key">Day A</div>
          <h2 id="day-name">Push</h2>
          <div class="focus" id="day-focus"></div>
        </div>
        <div class="day-actions">
          <button class="mini" id="btn-add">+ Exercise</button>
          <button class="mini solid" id="btn-finish">End session</button>
        </div>
      </div>

      <div class="prep">
        <details><summary>Warm-up</summary><ol id="warmup"></ol></details>
        <details><summary>Cool-down</summary><ol id="cooldown"></ol></details>
      </div>

      <div id="blocks"></div>

      <div class="notes">
        <div class="block-label"><span class="eyebrow">Session notes</span></div>
        <textarea id="notes" aria-label="Session notes" placeholder="How did it move? Sleep, energy, aches, anything the coach should know."></textarea>
        <div class="row">
          <span class="saved" id="notes-saved">saved</span>
          <span class="quiet-note">The coach reads these.</span>
        </div>
      </div>
    </section>

    <aside class="rail">
      <div class="timer" id="timer">
        <div class="timer-ring">
          <svg width="44" height="44"><circle class="bg" cx="22" cy="22" r="19"/><circle class="fg" id="t-arc" cx="22" cy="22" r="19"/></svg>
        </div>
        <div>
          <div class="t num" id="t-count">0:00</div>
          <div class="lbl" id="t-label">Rest</div>
        </div>
        <div class="acts">
          <button class="mini" data-t="+30">+30s</button>
          <button class="mini ghost" data-t="skip">Skip</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <span class="dot" id="live-dot"></span>
          <h3>This session</h3>
          <div class="right"><span class="num session-clock" id="sess-clock">--:--</span></div>
        </div>
        <div class="sum-grid">
          <div><div class="v" id="s-vol">0</div><div class="l">kg moved</div></div>
          <div><div class="v" id="s-sets">0</div><div class="l">sets</div></div>
          <div><div class="v" id="s-reps">0</div><div class="l">reps</div></div>
        </div>
      </div>

      <div class="panel coach" id="coach">
        <div class="panel-head">
          <span class="dot" id="coach-dot"></span>
          <h3>Coach</h3>
          <div class="coach-tabs right" role="tablist">
            <button role="tab" data-tab="chat" aria-selected="true">Chat</button>
            <button role="tab" data-tab="signals" aria-selected="false">Signals</button>
            <button role="tab" data-tab="setup" aria-selected="false">Setup</button>
          </div>
        </div>

        <div id="tab-chat">
          <div class="stream" id="stream"></div>
          <div class="chips" id="chips"></div>
          <form class="composer" id="composer">
            <textarea id="ask" rows="1" aria-label="Ask your coach" placeholder="Ask your coach anything..."></textarea>
            <button class="send" id="send" type="submit" aria-label="Send">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
          </form>
        </div>

        <div id="tab-signals" class="signals" hidden></div>
        <div id="tab-setup" class="setup" hidden></div>
      </div>

      <div class="panel">
        <div class="panel-head"><h3>Records</h3><div class="right"><button class="mini ghost" id="btn-sample">Demo data</button></div></div>
        <div class="recs" id="recs"></div>
      </div>

      <div class="data-actions">
        <button class="mini ghost" id="btn-export">Export JSON</button>
        <button class="mini ghost" id="btn-import">Import</button>
        <button class="mini ghost" id="btn-wipe">Reset</button>
      </div>
    </aside>
  </div>
</div>

<button class="fab" id="fab">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
  Coach
</button>

<dialog id="dlg">
  <div class="panel-head"><h3 id="dlg-title">Add exercise</h3></div>
  <div class="setup" id="dlg-body"></div>
</dialog>

<div class="toasts" id="toasts"></div>

<script>
/* ══════════════════════════════════════════════════════════════════
   0. CONFIG
   ══════════════════════════════════════════════════════════════════ */
const CONFIG = {
  key: '', 
  provider: 'gemini',
  model: 'gemini-3.6-flash',
  endpoint: 'https://generativelanguage.googleapis.com/v1beta'
};

/* ══════════════════════════════════════════════════════════════════
   1. PROGRAM DEFAULTS
   ══════════════════════════════════════════════════════════════════ */
const DEFAULT_PROGRAM = {
  a:{key:'a',name:'Push',focus:'Chest · Shoulders · Triceps',
    warmup:['5 min row or bike, easy','Band pull-aparts × 15','Shoulder CARs × 5 each side','Incline push-ups × 10','Two ramp-up sets on the first lift'],
    cooldown:['Doorway chest stretch × 30s','Overhead triceps stretch × 30s','Cross-body shoulder stretch × 30s','Nasal breathing × 2 min'],
    blocks:[
      {id:'primary',label:'Primary',items:[
        {id:'a1',name:'Dumbbell Bench Press',sets:3,reps:'8-10',rest:90,pr:true},
        {id:'a2',name:'Dumbbell Shoulder Press',sets:3,reps:'8-10',rest:90,pr:true}]},
      {id:'secondary',label:'Secondary',items:[
        {id:'a3',name:'Incline DB Press',sets:3,reps:'10-12',rest:75,pr:true},
        {id:'a4',name:'Lateral Raise',sets:3,reps:'12-15',rest:60},
        {id:'a5',name:'Triceps Pushdown',sets:3,reps:'12-15',rest:60},
        {id:'a6',name:'Cable Chest Fly',sets:3,reps:'12-15',rest:60}]},
      {id:'core',label:'Core & conditioning',items:[
        {id:'a7',name:'Plank Hold',sets:3,reps:'30-45s',rest:45},
        {id:'a8',name:'Cardio Intervals',sets:1,reps:'15 min',rest:0}]}
    ]},
  b:{key:'b',name:'Pull',focus:'Back · Biceps · Rear delts',
    warmup:['5 min treadmill or row','Band pull-aparts × 15','Cat-cow + thoracic rotations × 8','Dead hang × 20s','Two light rows'],
    cooldown:["Child's pose × 45s",'Lat stretch on the rack × 30s','Biceps wall stretch × 20s','Nasal breathing × 2 min'],
    blocks:[
      {id:'primary',label:'Primary',items:[
        {id:'b1',name:'Dumbbell Row',sets:3,reps:'8-10',rest:90,pr:true},
        {id:'b2',name:'Lat Pulldown',sets:3,reps:'8-10',rest:90,pr:true}]},
      {id:'secondary',label:'Secondary',items:[
        {id:'b3',name:'Seated Cable Row',sets:3,reps:'10-12',rest:75,pr:true},
        {id:'b4',name:'Face Pull',sets:3,reps:'15-20',rest:60},
        {id:'b5',name:'Dumbbell Curl',sets:3,reps:'10-12',rest:60},
        {id:'b6',name:'Hammer Curl',sets:3,reps:'10-12',rest:60}]},
      {id:'core',label:'Core & conditioning',items:[
        {id:'b7',name:'Dead Bug',sets:3,reps:'8 each',rest:45},
        {id:'b8',name:'Steady Cardio',sets:1,reps:'15 min',rest:0}]}
    ]},
  c:{key:'c',name:'Legs',focus:'Quads · Hamstrings · Glutes · Calves',
    warmup:['5 min bike, easy','Leg swings × 10 each direction','Bodyweight squats × 15','Glute bridges × 12','Two goblet ramp-up sets'],
    cooldown:['Standing quad stretch × 30s','Figure-4 hip stretch × 30s','Seated hamstring stretch × 30s','Calf stretch on a step × 30s'],
    blocks:[
      {id:'primary',label:'Primary',items:[
        {id:'c1',name:'Goblet Squat',sets:4,reps:'8-10',rest:90,pr:true},
        {id:'c2',name:'Romanian Deadlift',sets:3,reps:'8-10',rest:90,pr:true}]},
      {id:'secondary',label:'Secondary',items:[
        {id:'c3',name:'DB Reverse Lunge',sets:3,reps:'10 each',rest:75,pr:true},
        {id:'c4',name:'Leg Curl',sets:3,reps:'12-15',rest:60,pr:true},
        {id:'c5',name:'Calf Raise',sets:4,reps:'15-20',rest:45},
        {id:'c6',name:'Adductor Machine',sets:3,reps:'12-15',rest:60}]},
      {id:'core',label:'Core & conditioning',items:[
        {id:'c7',name:'Hip Thrust',sets:3,reps:'12-15',rest:60,pr:true},
        {id:'c8',name:'Incline Walk',sets:1,reps:'15 min',rest:0}]}
    ]}
};

/* ══════════════════════════════════════════════════════════════════
   2. STATE
   ══════════════════════════════════════════════════════════════════ */
const K = 'ironledger.v1.';
const load = (k,f)=>{try{const v=localStorage.getItem(K+k);return v?JSON.parse(v):structuredClone(f)}catch{return structuredClone(f)}};
const save = (k,v)=>{try{localStorage.setItem(K+k,JSON.stringify(v))}catch{}};

const S = {
  program: load('program', DEFAULT_PROGRAM),
  log:     load('log', {}),
  sessions:load('sessions', []),
  prs:     load('prs', {}),
  drafts:  load('drafts', {}),
  ai:      load('ai', {provider:CONFIG.provider, endpoint:CONFIG.endpoint, model:CONFIG.model, key:CONFIG.key}),
  chat:    load('chat', []),
  day:     'a'
};

// Keep previously saved browser settings from pinning the app to retired models.
const GEMINI_MODEL_MIGRATIONS = {
  'gemini-2.5-flash': 'gemini-3.6-flash',
  'gemini-2.5-flash-lite': 'gemini-3.5-flash-lite',
  'gemini-2.5-flash-preview-05-20': 'gemini-3.6-flash',
  'gemini-2.5-flash-preview-09-25': 'gemini-3.6-flash',
  'gemini-2.5-flash-preview-09-2025': 'gemini-3.6-flash',
  'gemini-2.0-flash': 'gemini-3.6-flash',
  'gemini-2.0-flash-exp': 'gemini-3.6-flash'
};
const normalizeGeminiModel = model => String(model || '').replace(/^models\//, '').trim();
let aiMigrated = false;
S.ai.model = normalizeGeminiModel(S.ai.model);
if (S.ai.provider === 'gemini-live') {
  S.ai.provider = CONFIG.provider;
  S.ai.model = CONFIG.model;
  S.ai.endpoint = CONFIG.endpoint;
  aiMigrated = true;
}
if (GEMINI_MODEL_MIGRATIONS[S.ai.model]) {
  S.ai.model = GEMINI_MODEL_MIGRATIONS[S.ai.model];
  aiMigrated = true;
}
if (S.ai.provider === 'gemini' && !/^https:\/\/generativelanguage\.googleapis\.com\/v1(?:beta)?$/.test(S.ai.endpoint || '')) {
  S.ai.endpoint = CONFIG.endpoint;
  aiMigrated = true;
}
if (aiMigrated) save('ai', S.ai);

/* ══════════════════════════════════════════════════════════════════
   3. UTIL
   ══════════════════════════════════════════════════════════════════ */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso = d => {const t=new Date(d); t.setMinutes(t.getMinutes()-t.getTimezoneOffset()); return t.toISOString().slice(0,10)};
const today = () => iso(new Date());
const daysBetween = (a,b) => Math.round((new Date(b+'T00:00') - new Date(a+'T00:00'))/86400000);
const e1rm = (w,r) => r>0 ? w*(1+r/30) : 0;
const round1 = n => Math.round(n*10)/10;
const fmtKg = n => n>=1000 ? round1(n/1000)+'t' : Math.round(n).toLocaleString();
const nice = d => new Date(d+'T00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});
const repTop = reps => {const m=String(reps).match(/(\d+)\s*(?:-|–|to)\s*(\d+)/); return m?+m[2]:(parseInt(reps)||0)};
const allItems = day => S.program[day].blocks.flatMap(b=>b.items);
const findItem = id => {for(const d of ['a','b','c']){const it=allItems(d).find(x=>x.id===id); if(it) return {item:it,day:d}} return null};

function toast(msg, kind=''){
  const el = document.createElement('div');
  el.className = 'toast '+kind; el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(()=>{el.classList.add('out'); setTimeout(()=>el.remove(),260)}, 3400);
}

function beep(){
  try{
    const ac = new (window.AudioContext||window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.frequency.value = 660; o.type='sine';
    g.gain.setValueAtTime(0.0001, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.14, ac.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+0.5);
    o.start(); o.stop(ac.currentTime+0.52);
  }catch{}
}

/* ══════════════════════════════════════════════════════════════════
   4. LIVE BACKDROP
   ══════════════════════════════════════════════════════════════════ */
const bg = $('#bg'), bx = bg.getContext('2d', {alpha:false});
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
let VW=0, VH=0, DPR=1;

const CELLS = [
  {c:[232,112, 58], r:0.62, ax:0.30, ay:0.20, fx:0.031, fy:0.043, px:0.9, py:1.7, a:0.30},
  {c:[ 62,178,150], r:0.50, ax:0.26, ay:0.24, fx:0.024, fy:0.037, px:2.6, py:0.4, a:0.20},
  {c:[240,186, 84], r:0.40, ax:0.22, ay:0.18, fx:0.041, fy:0.029, px:4.1, py:3.3, a:0.16}
];
let MOTES = [];
let heat = 0, heatTarget = 0;
let pointerX = 0.5, pointerY = 0.28;

function sizeBG(){
  DPR = Math.min(1.5, window.devicePixelRatio||1);
  VW = innerWidth; VH = innerHeight;
  bg.width = VW*DPR; bg.height = VH*DPR;
  bx.setTransform(DPR,0,0,DPR,0,0);
  const n = Math.round(Math.min(90, (VW*VH)/16000));
  MOTES = Array.from({length:n},()=>({
    x:Math.random()*VW, y:Math.random()*VH,
    r:Math.random()*1.5+0.4, v:Math.random()*0.22+0.05,
    d:Math.random()*Math.PI*2, o:Math.random()*0.3+0.06, s:Math.random()*0.5+0.4
  }));
}

function paintBG(t){
  const s = t/1000;
  bx.fillStyle = '#211d1a';
  bx.fillRect(0,0,VW,VH);
  bx.fillStyle = 'rgba(15,14,13,1)';
  bx.fillRect(0,0,VW,VH);

  const R = Math.max(VW,VH);
  bx.globalCompositeOperation = 'lighter';
  for(const c of CELLS){
    const x = VW*0.5 + Math.sin(s*c.fx + c.px)*VW*c.ax + (pointerX-.5)*36*c.r;
    const y = VH*0.5 + Math.cos(s*c.fy + c.py)*VH*c.ay + (pointerY-.5)*28*c.r;
    const rad = R*c.r*(1 + Math.sin(s*0.05 + c.px)*0.07);
    const alpha = c.a*(0.72 + heat*0.55);
    const g = bx.createRadialGradient(x,y,0,x,y,rad);
    g.addColorStop(0,   `rgba(${c.c[0]},${c.c[1]},${c.c[2]},${alpha})`);
    g.addColorStop(0.42,`rgba(${c.c[0]},${c.c[1]},${c.c[2]},${alpha*0.28})`);
    g.addColorStop(1,   `rgba(${c.c[0]},${c.c[1]},${c.c[2]},0)`);
    bx.fillStyle = g; bx.fillRect(0,0,VW,VH);
  }

  for(const m of MOTES){
    m.y -= m.v*(0.55 + heat*1.4);
    m.x += Math.sin(s*0.35 + m.d)*0.22;
    if(m.y < -8){ m.y = VH+8; m.x = Math.random()*VW; }
    const tw = 0.62 + Math.sin(s*m.s + m.d)*0.38;
    bx.fillStyle = `rgba(238,150,96,${m.o*tw*(0.5+heat*0.9)})`;
    bx.beginPath(); bx.arc(m.x, m.y, m.r, 0, 6.2832); bx.fill();
  }
  bx.globalCompositeOperation = 'source-over';
}

let last = 0;
function frame(t){
  heat += (heatTarget-heat)*0.02;
  if(t-last > 33){ paintBG(t); last = t; }
  requestAnimationFrame(frame);
}
sizeBG();
addEventListener('resize', ()=>{ sizeBG(); paintBG(performance.now()); });
addEventListener('pointermove', event=>{
  pointerX = event.clientX / Math.max(1,VW);
  pointerY = event.clientY / Math.max(1,VH);
  document.documentElement.style.setProperty('--pointer-x', `${event.clientX}px`);
  document.documentElement.style.setProperty('--pointer-y', `${event.clientY}px`);
}, {passive:true});
if(calm){ heat = 0.35; paintBG(0); } else { requestAnimationFrame(frame); }

/* ══════════════════════════════════════════════════════════════════
   5. DRAFT
   ══════════════════════════════════════════════════════════════════ */
function draft(day=S.day){
  let d = S.drafts[day];
  if(!d || d.date !== today()) { d = {date:today(), start:null, ex:{}, notes:''}; S.drafts[day]=d; }
  return d;
}
function setsOf(day, item){
  const d = draft(day);
  if(!d.ex[item.id] || d.ex[item.id].length !== item.sets){
    const cur = d.ex[item.id] || [];
    d.ex[item.id] = Array.from({length:item.sets},(_,i)=> cur[i] || {w:'',r:'',done:false});
  }
  return d.ex[item.id];
}
const persistDraft = () => save('drafts', S.drafts);

/* ══════════════════════════════════════════════════════════════════
   6. HEADER / HEATMAP / DAY BAR
   ══════════════════════════════════════════════════════════════════ */
function streaks(){
  const dates = [...new Set(S.sessions.map(s=>s.date))].sort();
  let cur=0, best=0;
  for(let i=0;i<dates.length;i++){
    cur = i===0 ? 1 : (daysBetween(dates[i-1],dates[i])<=2 ? cur+1 : 1);
    best = Math.max(best,cur);
  }
  const live = dates.length && daysBetween(dates.at(-1), today())<=2 ? cur : 0;
  return {live, best, dates};
}

function renderMeta(){
  const {live,best,dates} = streaks();
  const tonnage = S.sessions.reduce((a,s)=>a+(s.vol||0),0);
  const last = dates.at(-1);
  const wk = S.sessions.filter(s=>daysBetween(s.date,today())<7).length;
  $('#meta').innerHTML = S.sessions.length ? `
    <span><b>${S.sessions.length}</b> sessions</span><span class="sep">/</span>
    <span class="hot"><b>${live}</b> day streak</span><span class="sep">/</span>
    <span>best <b>${best}</b></span><span class="sep">/</span>
    <span><b>${fmtKg(tonnage)}</b> kg lifted</span><span class="sep">/</span>
    <span><b>${wk}</b> this week</span><span class="sep">/</span>
    <span>last <b>${last?nice(last):'—'}</b></span>`
    : `<span style="color:var(--text-3)">No sessions logged yet. Tick a set to start the clock.</span>`;

  const order = ['a','b','c'];
  const lastDay = S.sessions.at(-1)?.day;
  const next = lastDay ? order[(order.indexOf(lastDay)+1)%3] : 'a';
  $('#next-up').textContent = `Up next · Day ${next.toUpperCase()} ${S.program[next].name}`;
  return next;
}

function renderHeat(){
  const byDate = {};
  S.sessions.forEach(s=>byDate[s.date]=(byDate[s.date]||0)+(s.vol||0));
  const end = new Date(); const start = new Date();
  start.setDate(end.getDate() - (11*7 + end.getDay()));
  let html='';
  for(let i=0;i<12*7;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const ds = iso(d);
    if(daysBetween(ds, today())<0){ html+=`<i style="--i:${i};opacity:.25"></i>`; continue; }
    const v = byDate[ds]||0;
    const t = v===0?'':(v<2500?'t1':v<6000?'t2':'t3');
    html+=`<i class="${t}${ds===today()?' today':''}" style="--i:${i}" title="${nice(ds)} · ${v?fmtKg(v)+' kg':'rest'}"></i>`;
  }
  $('#heat').innerHTML = html;
}

function renderDaybar(){
  $('#daybar').innerHTML = ['a','b','c'].map(k=>{
    const p = S.program[k];
    const doneToday = S.sessions.some(s=>s.date===today() && s.day===k);
    return `<button class="day-t" role="tab" data-day="${k}" aria-selected="${S.day===k}">
      <span class="k">${k.toUpperCase()}</span>
      <span><span class="n">${esc(p.name)}</span><br><span class="s">${allItems(k).length} lifts</span></span>
      ${doneToday?'<span class="badge">done</span>':''}
    </button>`;
  }).join('');
}

/* ══════════════════════════════════════════════════════════════════
   7. THE DAY
   ══════════════════════════════════════════════════════════════════ */
function history(exId){ return S.log[exId]||[] }
function lastEntry(exId){ return history(exId).at(-1) }

function sparkline(exId){
  const h = history(exId).slice(-8);
  const pts = h.map(e=>Math.max(...e.sets.map(s=>e1rm(+s.w||0,+s.r||0)),0)).filter(v=>v>0);
  if(pts.length<2) return '';
  const w=56,ht=18,min=Math.min(...pts),max=Math.max(...pts),span=(max-min)||1;
  const d = pts.map((v,i)=>`${(i/(pts.length-1))*w},${ht-((v-min)/span)*ht}`).join(' ');
  const trend = pts.at(-1)-pts[0];
  const col = trend>0.5?'var(--jade)':trend<-0.5?'var(--ember)':'var(--text-3)';
  return `<span class="spark">
    <svg width="${w}" height="${ht}" viewBox="0 0 ${w} ${ht}"><polyline points="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
    <span class="lbl" style="color:${col}">${trend>0?'+':''}${round1(trend)}</span></span>`;
}

function exRow(item, idx){
  const sets = setsOf(S.day, item);
  const done = sets.filter(s=>s.done).length;
  const pct = item.sets ? done/item.sets : 0;
  const C = 2*Math.PI*13;
  const prev = lastEntry(item.id);
  const pr = S.prs[item.id];
  const vol = sets.reduce((a,s)=>a+((+s.w||0)*(+s.r||0)),0);
  const prevTxt = prev ? `<span class="prev">last ${prev.sets.filter(s=>s.w).map(s=>`${s.w}×${s.r}`).join(' ')}</span>` : '';

  const setRows = sets.map((s,i)=>{
    const p = prev?.sets?.[i];
    const better = p && (+s.w||0)*(+s.r||0) > (+p.w||0)*(+p.r||0);
    return `<div class="set" data-set="${i}">
      <span class="sn">${i+1}</span>
      <span class="field"><input type="number" step="0.5" min="0" inputmode="decimal" data-f="w" value="${s.w}" placeholder="${p?p.w:'—'}" aria-label="Set ${i+1} weight"><span class="unit">kg</span></span>
      <span class="field"><input type="number" step="1" min="0" inputmode="numeric" data-f="r" value="${s.r}" placeholder="${p?p.r:item.reps}" aria-label="Set ${i+1} reps"><span class="unit">rp</span></span>
      <span class="hint ${better?'up':''}">${p?`prev ${p.w}×${p.r}`:'first time'}</span>
      <button class="tick" data-tick="${i}" aria-pressed="${!!s.done}" aria-label="Complete set ${i+1}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </button>
    </div>`;
  }).join('');

  return `<article class="ex${done===item.sets&&done>0?' done':''}" data-ex="${item.id}" style="--i:${idx}">
    <button class="ex-head" aria-expanded="false">
      <span class="ring">
        <svg width="30" height="30"><circle class="bg" cx="15" cy="15" r="13"/><circle class="fg" cx="15" cy="15" r="13" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}"/></svg>
        <b>${done}/${item.sets}</b>
      </span>
      <span>
        <span class="ex-name">${esc(item.name)}</span>
        <span class="ex-sub"><span>${item.sets} × ${esc(item.reps)}</span>${item.rest?`<span>rest ${item.rest}s</span>`:''} ${prevTxt}</span>
      </span>
      ${pr?`<span class="pr-chip">PR ${pr.w}kg</span>`:'<span></span>'}
      <span class="chev"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></span>
    </button>
    <div class="ex-body"><div><div class="ex-inner">
      <div class="sets">${setRows}</div>
      <div class="ex-foot">
        <span class="vol">${fmtKg(vol)} kg</span>
        <button data-act="addset">+ set</button>
        <button data-act="drop">remove</button>
        <button data-act="ask">ask coach</button>
        ${sparkline(item.id)}
      </div>
    </div></div></div>
  </article>`;
}

function renderDay(){
  const p = S.program[S.day];
  $('#day-key').textContent = 'Day '+S.day.toUpperCase();
  $('#day-name').textContent = p.name;
  $('#day-focus').textContent = p.focus;
  $('#warmup').innerHTML = p.warmup.map(x=>`<li>${esc(x)}</li>`).join('');
  $('#cooldown').innerHTML = p.cooldown.map(x=>`<li>${esc(x)}</li>`).join('');

  let i = 0;
  $('#blocks').innerHTML = p.blocks.map(b=>`
    <div class="block-label"><span class="eyebrow">${esc(b.label)}</span></div>
    ${b.items.map(it=>exRow(it, i++)).join('') || '<div class="empty">Nothing here yet.</div>'}
  `).join('');

  $('#notes').value = draft().notes || '';
  renderSummary();
  renderDaybar();
}

function renderSummary(){
  const d = draft();
  let vol=0, sets=0, reps=0;
  Object.values(d.ex).forEach(arr=>arr.forEach(s=>{
    if(s.done){ sets++; reps += +s.r||0; vol += (+s.w||0)*(+s.r||0); }
  }));
  countTo($('#s-vol'), vol);
  $('#s-sets').textContent = sets;
  $('#s-reps').textContent = reps;
  $('#live-dot').classList.toggle('live', sets>0);
  heatTarget = Math.min(1, sets/18);
  return {vol,sets,reps};
}

function countTo(el, target){
  const from = +(el.dataset.v||0);
  if(from===target){ el.textContent = fmtKg(target); el.dataset.v=target; return; }
  el.dataset.v = target;
  const t0 = performance.now(), dur=520;
  const step = t => {
    const k = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-k,4);
    el.textContent = fmtKg(from + (target-from)*e);
    if(k<1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ══════════════════════════════════════════════════════════════════
   8. INTERACTIONS
   ══════════════════════════════════════════════════════════════════ */
$('#daybar').addEventListener('click', e=>{
  const b = e.target.closest('[data-day]'); if(!b) return;
  S.day = b.dataset.day; renderDay();
});

$('#blocks').addEventListener('click', e=>{
  const card = e.target.closest('.ex'); if(!card) return;
  const id = card.dataset.ex, item = findItem(id)?.item;
  if(!item) return;

  if(e.target.closest('.ex-head')){
    const open = card.hasAttribute('open-body');
    card.toggleAttribute('open-body', !open);
    card.querySelector('.ex-head').setAttribute('aria-expanded', String(!open));
    return;
  }
  const tick = e.target.closest('[data-tick]');
  if(tick){ toggleSet(item, +tick.dataset.tick, tick); return; }

  const act = e.target.closest('[data-act]')?.dataset.act;
  if(act==='addset'){ item.sets++; save('program',S.program); redrawKeepOpen(); }
  if(act==='drop'){ removeExercise(id); }
  if(act==='ask'){ askCoach(`Look at my ${item.name} numbers. Am I progressing, and what weight should I use next session?`); }
});

$('#blocks').addEventListener('input', e=>{
  const inp = e.target.closest('input[data-f]'); if(!inp) return;
  const card = e.target.closest('.ex'), i = +e.target.closest('.set').dataset.set;
  const item = findItem(card.dataset.ex).item;
  setsOf(S.day,item)[i][inp.dataset.f] = inp.value;
  persistDraft();
  const vol = setsOf(S.day,item).reduce((a,s)=>a+((+s.w||0)*(+s.r||0)),0);
  card.querySelector('.vol').textContent = fmtKg(vol)+' kg';
  renderSummary();
});

$('#blocks').addEventListener('keydown', e=>{
  if(e.key!=='Enter') return;
  const inp = e.target.closest('input[data-f]'); if(!inp) return;
  e.preventDefault();
  const row = inp.closest('.set');
  if(inp.dataset.f==='w'){ row.querySelector('[data-f="r"]').focus(); }
  else { row.querySelector('.tick').click(); row.nextElementSibling?.querySelector('[data-f="w"]')?.focus(); }
});

function toggleSet(item, i, btn){
  const arr = setsOf(S.day, item), s = arr[i];
  s.done = !s.done;
  if(s.done && !s.w && !s.r){
    const p = lastEntry(item.id)?.sets?.[i];
    if(p){ s.w = p.w; s.r = p.r; }
  }
  persistDraft();
  if(s.done){
    if(!draft().start){ draft().start = Date.now(); persistDraft(); }
    btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop');
    checkPR(item, s);
    if(item.rest) startRest(item);
  }
  redrawKeepOpen();
}

function redrawKeepOpen(){
  const open = $$('.ex[open-body]').map(e=>e.dataset.ex);
  renderDay();
  open.forEach(id=>{
    const el = $(`.ex[data-ex="${CSS.escape(id)}"]`);
    if(el){ el.setAttribute('open-body',''); el.querySelector('.ex-head').setAttribute('aria-expanded','true'); }
  });
}

function checkPR(item, s){
  const w = +s.w||0, r = +s.r||0;
  if(!w || !r) return;
  const cur = S.prs[item.id], e = e1rm(w,r);
  if(!cur || e > cur.e1rm + 0.01){
    S.prs[item.id] = {w, r, e1rm:round1(e), date:today(), name:item.name};
    save('prs', S.prs);
    renderRecords();
    toast(`New PR · ${item.name} ${w}kg × ${r}`, 'win');
    heatTarget = Math.min(1, heatTarget + 0.35);
    beep();
  }
}

function removeExercise(id){
  S.program[S.day].blocks.forEach(b=>{ b.items = b.items.filter(x=>x.id!==id) });
  save('program', S.program);
  renderDay(); toast('Removed from the plan');
}

let restT = null, restEnd = 0, restTotal = 0;
function startRest(item){
  restTotal = item.rest; restEnd = Date.now()+item.rest*1000;
  $('#timer').classList.add('on');
  $('#t-label').textContent = 'Rest · '+item.name;
  clearInterval(restT); tickRest(); restT = setInterval(tickRest, 250);
}
function tickRest(){
  const left = Math.max(0,(restEnd-Date.now())/1000);
  const C = 2*Math.PI*19;
  $('#t-arc').setAttribute('stroke-dasharray', C);
  $('#t-arc').style.strokeDashoffset = C*(1-left/restTotal);
  $('#t-count').textContent = `${Math.floor(left/60)}:${String(Math.floor(left%60)).padStart(2,'0')}`;
  if(left<=0){ clearInterval(restT); beep(); $('#t-label').textContent='Go'; setTimeout(()=>$('#timer').classList.remove('on'),2200); }
}
$('#timer').addEventListener('click', e=>{
  const t = e.target.closest('[data-t]')?.dataset.t; if(!t) return;
  if(t==='+30'){ restEnd += 30000; restTotal += 30; tickRest(); }
  else { clearInterval(restT); $('#timer').classList.remove('on'); }
});

setInterval(()=>{
  const st = draft().start;
  $('#sess-clock').textContent = st ? (()=>{const m=Math.floor((Date.now()-st)/60000); return `${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`})() : '--:--';
}, 1000);

let nT;
$('#notes').addEventListener('input', e=>{
  draft().notes = e.target.value; clearTimeout(nT);
  nT = setTimeout(()=>{ persistDraft(); $('#notes-saved').classList.add('on'); setTimeout(()=>$('#notes-saved').classList.remove('on'),1400); }, 450);
});

$('#btn-finish').addEventListener('click', ()=>{
  const d = draft(), day = S.day;
  const {vol,sets,reps} = renderSummary();
  if(!sets){ toast('Log at least one set first','bad'); return; }
  allItems(day).forEach(item=>{
    const arr = (d.ex[item.id]||[]).filter(s=>s.done && (s.w||s.r));
    if(!arr.length) return;
    (S.log[item.id] ||= []).push({date:d.date, sets:arr.map(s=>({w:+s.w||0,r:+s.r||0}))});
    if(S.log[item.id].length>40) S.log[item.id].shift();
  });
  const mins = d.start ? Math.round((Date.now()-d.start)/60000) : null;
  S.sessions.push({date:d.date, day, vol:Math.round(vol), sets, reps, mins, notes:d.notes||''});
  save('log',S.log); save('sessions',S.sessions);
  delete S.drafts[day]; persistDraft();
  renderAll();
  toast(`Session banked · ${fmtKg(vol)} kg, ${sets} sets`, 'ok');
  if(configured()) setTimeout(()=>askCoach('I just finished this session. Debrief me: what went well, what to fix, and what to hit next time.', true), 700);
});

$('#btn-add').addEventListener('click', ()=>{
  $('#dlg-title').textContent = 'Add exercise to Day '+S.day.toUpperCase();
  $('#dlg-body').innerHTML = `

    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">

    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="mini ghost" id="f-cancel">Cancel</button>

    </div>`;
  $('#dlg').showModal();

function buildSignals(){
  const out = [];
  const jump = it => /squat|deadlift|rdl|lunge|thrust|leg|calf/i.test(it.name) ? 5 : 2.5;

  ['a','b','c'].forEach(day=>{
    allItems(day).forEach(it=>{
      const h = history(it.id);
      if(h.length<2) return;
      const top = repTop(it.reps); if(!top) return;
      const [prev,last] = h.slice(-2);
      const maxed = e => e.sets.length>=it.sets && e.sets.every(s=>(+s.r||0)>=top);
      if(maxed(last) && maxed(prev)){
        const w = Math.max(...last.sets.map(s=>+s.w||0));
        out.push({kind:'up', t:it.name, d:`Topped out at <b>${top} reps</b> on every set, twice. Move to <b>${round1(w+jump(it))} kg</b> and reset to the bottom of the range.`,
                  act:{label:'Ask the coach', q:`Confirm the jump on ${it.name}: I hit all sets at ${top} reps twice at ${w} kg.`}});
      }
      const e = h.slice(-3).map(x=>Math.max(...x.sets.map(s=>e1rm(+s.w||0,+s.r||0))));
      if(e.length===3 && e[2]<=e[0]+0.5){
        out.push({kind:'hold', t:it.name, d:`Estimated 1RM flat for three sessions (<b>${e.map(v=>Math.round(v)).join(' → ')}</b>). Change one variable: tempo, rest, or drop 10% and rebuild.`,
                  act:{label:'Fix this', q:`${it.name} has stalled for 3 sessions (e1RM ${e.map(v=>Math.round(v)).join(', ')}). Give me a plan to break through.`}});
      }
    });
  });

  ['a','b','c'].forEach(day=>{
    const last = [...S.sessions].reverse().find(s=>s.day===day);
    const gap = last ? daysBetween(last.date, today()) : null;
    if(gap===null && S.sessions.length)
      out.push({kind:'warn', t:`Day ${day.toUpperCase()} ${S.program[day].name}`, d:`Never logged. If it is not happening, cut it and rebalance the week.`});
    else if(gap!==null && gap>=10)
      out.push({kind:'warn', t:`Day ${day.toUpperCase()} ${S.program[day].name}`, d:`<b>${gap} days</b> since you trained it. That is where imbalances start.`});
  });

  const win = S.sessions.filter(s=>daysBetween(s.date,today())<=28);
  const push = win.filter(s=>s.day==='a').reduce((a,s)=>a+s.vol,0);
  const pull = win.filter(s=>s.day==='b').reduce((a,s)=>a+s.vol,0);
  if(push+pull>3000){
    const ratio = pull/(push||1);
    if(ratio<0.8) out.push({kind:'warn', t:'Push heavy', d:`Last 28 days: <b>${fmtKg(push)}</b> push vs <b>${fmtKg(pull)}</b> pull. Add a pull set or your shoulders will file a complaint.`});
    else if(ratio>1.35) out.push({kind:'info', t:'Pull heavy', d:`Pull volume is <b>${Math.round(ratio*100)}%</b> of push. Fine for posture, watch the bench numbers.`});
  }

  const perWeek = [0,1,2].map(w=>S.sessions.filter(s=>{const g=daysBetween(s.date,today()); return g>=w*7 && g<(w+1)*7}).length);
  if(S.sessions.length>=3)
    out.push({kind: perWeek[0]>=3?'up':'info', t:'Frequency', d:`Sessions per week, most recent first: <b>${perWeek.join(' · ')}</b>. Three is the floor for this split.`});

  if(!out.length) out.push({kind:'info', t:'Not enough data', d:`Log two sessions and real signals show up here. No key needed for this tab.`});
  return out.slice(0,7);
}

const SYSTEM = `You are the strength coach built into this person's training log. You can see every set, note and PR they have recorded.

Voice: direct, concrete, a bit blunt. A good coach, not a wellness app. No hedging, no "listen to your body" filler, no emoji. Short paragraphs, 120 words max unless they ask for a full program.

Rules:
- Always cite their actual numbers. "Your bench e1RM went 41 -> 44 in three weeks" beats "you're progressing well".
- Give ONE clear directive per reply: the exact weight, reps or change to make next session.
- Progression default: hit the top of the rep range on every set for two sessions, then add 2.5kg upper body / 5kg lower body and reset to the bottom of the range.
- If they mention pain (sharp, joint, nerve), tell them to stop that movement, suggest a substitution, and say to see a professional if it persists. Soreness is not pain.
- If data is thin, say so and tell them what to log.

Changing the plan: only when the data justifies it. When you do, append a fenced json block at the very end of your reply:
\`\`\`json
{"actions":[{"type":"set_target","day":"a","exercise":"Dumbbell Bench Press","sets":4,"reps":"6-8","rest":120},
{"type":"add_exercise","day":"c","block":"secondary","name":"Bulgarian Split Squat","sets":3,"reps":"8 each","rest":75},
{"type":"remove_exercise","day":"a","exercise":"Cable Chest Fly"},
{"type":"rename_exercise","day":"b","exercise":"Face Pull","name":"Reverse Pec Deck"}]}
\`\`\`
Match "exercise" to the exact name in the data. day is "a", "b" or "c". block is "primary", "secondary" or "core". Never output the json block unless you are proposing a real change, and never mention the block in your prose.`;

function md(t){
  const safe = esc(t).replace(/```json[\s\S]*?```/g,'').replace(/```[\s\S]*?```/g,'');
  const lines = safe.split('\n'); let html='', list=null;
  const inline = s => s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
                       .replace(/(^|\W)\*(?!\s)(.+?)\*(?=\W|$)/g,'$1<em>$2</em>')
                       .replace(/`(.+?)`/g,'<code>$1</code>');
  const close = ()=>{ if(list){ html+=`</${list}>`; list=null; } };
  for(const raw of lines){
    const l = raw.trim();
    if(!l){ close(); continue; }
    let m;
    if(m = l.match(/^#{1,4}\s+(.*)/)){ close(); html+=`<h4>${inline(m[1])}</h4>`; }
    else if(m = l.match(/^[-*•]\s+(.*)/)){ if(list!=='ul'){close(); html+='<ul>'; list='ul';} html+=`<li>${inline(m[1])}</li>`; }
    else if(m = l.match(/^\d+[.)]\s+(.*)/)){ if(list!=='ol'){close(); html+='<ol>'; list='ol';} html+=`<li>${inline(m[1])}</li>`; }
    else { close(); html+=`<p>${inline(l)}</p>`; }
  }
  close(); return html;
}

let coachAutoScroll = true;

function coachNearBottom(){
  return coachStream.scrollHeight - coachStream.scrollTop - coachStream.clientHeight < 72;

function pauseCoachAutoScroll(){ coachAutoScroll = false; }
function scrollCoachToBottom(force=false){
  if(force || coachAutoScroll){
    requestAnimationFrame(()=>{
      coachStream.scrollTop = Math.max(0,coachStream.scrollHeight-coachStream.clientHeight);
    });
  }
}
// User intent must win over streaming updates. Waiting only for a scroll event

coachStream.addEventListener('pointerdown', e=>{
  if(e.pointerType==='touch' || e.pointerType==='pen') pauseCoachAutoScroll();
}, {passive:true});
coachStream.addEventListener('scroll', ()=>{

// On desktop, a wheel started on the coach header also scrolls the message area.

$('#coach').addEventListener('wheel', e=>{

  const max = coachStream.scrollHeight-coachStream.clientHeight;

    pauseCoachAutoScroll();
    coachStream.scrollTop = next;

function callGeminiLive(messages, onDelta){
  const cfg = S.ai;
  const sys = messages[0]?.content || '';
  const rest = messages.slice(1);
  const base = (cfg.endpoint||'').replace(/[?&]+$/,'');
  const joiner = base.includes('?') ? '&' : '?';
  const url = `${base}${joiner}key=${encodeURIComponent(cfg.key)}`;

  const transcript = rest.map(m =>
    `${m.role==='assistant' ? 'COACH' : 'USER'}: ${m.content}`
  ).join('\n\n') + '\n\nReply to the latest USER message.';

  return new Promise((resolve, reject)=>{
    let ws, full='', finished=false, setupSent=false;
    const timeout = setTimeout(()=>finish(new Error('Gemini Live timed out')), 45000);

    function finish(err){
      if(finished) return;
      finished = true;
      clearTimeout(timeout);
      try{ if(ws && ws.readyState < 2) ws.close(1000, 'done'); }catch{}
      err ? reject(err) : resolve(full);
    }

    try{ ws = new WebSocket(url); }
    catch(err){ finish(err); return; }

    ws.onopen = () => {
      ws.send(JSON.stringify({
        setup: {
          model: `models/${cfg.model}`,
          generationConfig: {
            responseModalities: ['AUDIO']
          },
          systemInstruction: {
            parts: [{ text: sys }]
          }
        }
      }));
      setupSent = true;
    };

    ws.onmessage = event=>{
      let j;
      try{ j = JSON.parse(event.data); }
      catch{ return; }

      if(j.setupComplete){
        ws.send(JSON.stringify({realtimeInput:{text:transcript}}));
        return;
      }

      if(j.error){
        finish(new Error(j.error.message || JSON.stringify(j.error)));
        return;
      }

      const sc = j.serverContent;
      if(sc){
        const text = (sc.modelTurn?.parts || []).map(p=>p.text||'').join('');
        if(text){ full += text; onDelta(text); }
        if(sc.turnComplete) finish();
      }
    };

    ws.onerror = ()=>finish(new Error('Gemini Live WebSocket connection failed'));
    ws.onclose = event=>{
      if(!finished){
        const detail = event.reason ? ` · ${event.reason}` : '';
        finish(new Error(`Gemini Live closed (${event.code})${detail}${setupSent?'':' before setup'}`));
      }
    };
  });
}

async function callModel(messages, onDelta){
  const cfg = S.ai, kind = preset().kind;
  const base = (cfg.endpoint||'').replace(/\/+$/,'');
  const sys = messages[0].content;
  const rest = messages.slice(1);

  if(kind==='gemini-live') return callGeminiLive(messages, onDelta);

  if(kind==='gemini' || kind==='gemini-proxy'){
    const model = normalizeGeminiModel(cfg.model) || CONFIG.model;
    // Send the workout snapshot plus recent chat as one interaction. This avoids
    // legacy Gemini 3 thought-signature/history problems while keeping context.
    const input = rest.map(m => `${m.role==='assistant' ? 'COACH' : 'USER'}:\n${m.content}`).join('\n\n');
    const payload = {
      model,
      system_instruction: sys,
      input,
      store: false,
      generation_config: {
        max_output_tokens: 1600,
        thinking_level: 'low',
        thinking_summaries: 'none'
      }
    };
    const url = kind==='gemini'
      ? `${base}/interactions`
      : `${base}?model=${encodeURIComponent(model)}`;
    const headers = {'content-type':'application/json'};
    if(kind==='gemini') headers['x-goog-api-key'] = cfg.key;
    const res = await fetch(url,{method:'POST',headers,body:JSON.stringify(payload)});
    const raw = await res.text();
    if(!res.ok){
      let detail = raw;
      try{ const j = JSON.parse(raw); detail = j.error?.message || j.message || raw; }catch{}
      throw new Error(`${res.status} · ${String(detail).slice(0,300)}`);
    }
    let j;
    try{ j = JSON.parse(raw); }
    catch{ throw new Error('Gemini returned invalid JSON. Check the endpoint or proxy response.'); }
    const txt = j.output_text || (j.steps||[])
      .filter(step=>step.type==='model_output')
      .flatMap(step=>step.content||[])
      .filter(part=>part.type==='text')
      .map(part=>part.text||'').join('');
    if(!txt) throw new Error(`Gemini returned no text (status: ${j.status || 'unknown'}).`);
    onDelta(txt);
    return txt;
  }

  if(kind==='anthropic'){
    const res = await fetch(base+'/v1/messages',{method:'POST',
      headers:{'content-type':'application/json','x-api-key':cfg.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:cfg.model,max_tokens:1400,stream:true,system:sys,messages:rest})});
    if(!res.ok) throw new Error(`${res.status} · ${(await res.text()).slice(0,240)}`);
    return readSSE(res, j => j.delta?.text||'', onDelta);
  }

  const headers = {'content-type':'application/json'};
  if(cfg.key) headers.authorization = 'Bearer '+cfg.key;
  const res = await fetch(base+'/chat/completions',{method:'POST',headers,
    body:JSON.stringify({model:cfg.model,messages,stream:true,temperature:0.6})});
  if(!res.ok) throw new Error(`${res.status} · ${(await res.text()).slice(0,240)}`);
  return readSSE(res, j => j.choices?.[0]?.delta?.content||'', onDelta);
}

async function readSSE(res, pick, onDelta){
  if(!(res.headers.get('content-type')||'').includes('event-stream')){
    const j = await res.json();
    const txt = (j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('')
             || j.choices?.[0]?.message?.content
             || (Array.isArray(j.content)?j.content.map(c=>c.text||'').join(''):'') || '';
    onDelta(txt); return txt;
  }
  const rd = res.body.getReader(), dec = new TextDecoder();
  let buf='', full='';
  for(;;){
    const {done,value} = await rd.read(); if(done) break;
    buf += dec.decode(value,{stream:true});
    const chunks = buf.split('\n\n'); buf = chunks.pop();
    for(const c of chunks) for(const line of c.split('\n')){
      if(!line.startsWith('data:')) continue;
      const d = line.slice(5).trim();
      if(!d || d==='[DONE]') continue;
      try{ const t = pick(JSON.parse(d)); if(t){ full += t; onDelta(t); } }catch{}
    }
  }
  return full;
}

async function askCoach(text, silentUser=false){

  switchTab('chat');
  busy = true; $('#send').disabled = true;

  S.chat.push({role:'user', content:text, hidden:silentUser});
  S.chat.push({role:'assistant', content:''});
  coachAutoScroll = true;
  renderChat();
  const bubble = $('#stream').lastElementChild;
  bubble.innerHTML = `<div class="who">Coach</div><div class="typing"><i></i><i></i><i></i></div>`;

  const hist = S.chat.filter(m=>m.content).slice(-10).map(({role,content})=>({role,content}));
  const messages = [
    {role:'system', content: SYSTEM},
    {role:'user', content: `TRAINING DATA (json):\n${snapshot()}`},
    {role:'assistant', content:'Got it. I have your numbers.'},
    ...hist
  ];

  let acc = '';
  try{
    await callModel(messages, chunk=>{
      acc += chunk;
      S.chat.at(-1).content = acc;
      bubble.innerHTML = `<div class="who">Coach</div>${md(acc)}`;
      scrollCoachToBottom();
    });
    const m = acc.match(/```json\s*([\s\S]*?)```/);
    if(m){ try{ const p = JSON.parse(m[1]); if(Array.isArray(p.actions) && p.actions.length) S.chat.at(-1).actions = p.actions; }catch{} }
    if(!acc.trim()) S.chat.at(-1).content = 'The model returned nothing. Try a different model in Setup.';
  }catch(err){
    const e = String(err.message||err);
    const hint = /404|no longer available|not found/i.test(e) ? 'That model was retired or is unavailable to this project. Select gemini-3.6-flash in Setup.'
              : /400/.test(e) ? 'The request shape or model setting is invalid. Restore the Google endpoint and use a listed model.'
              : /403|401/.test(e) ? 'The key was rejected. Create a new AI Studio auth key and make sure it is allowed to use the Gemini API.'
              : /429/.test(e) ? 'Rate limited. Wait a moment, then retry.'
              : /Failed to fetch|NetworkError/.test(e) ? 'The browser could not reach the API. Check the endpoint, network, or use the included proxy.'
              : 'Check the provider, current model name, endpoint, and key in Setup.';
    S.chat.at(-1).content = `Could not reach the model.\n\n\`${e}\`\n\n${hint}`;
  }
  busy = false; $('#send').disabled = false;
  save('chat', S.chat.slice(-24)); renderChat();
}

function switchTab(name){
  $$('.coach-tabs button').forEach(b=>b.setAttribute('aria-selected', String(b.dataset.tab===name)));
  ['chat','signals','setup'].forEach(t=>$('#tab-'+t).hidden = t!==name);
  if(name==='signals') renderSignals();
  if(name==='setup') renderSetup();
}
$('.coach-tabs').addEventListener('click', e=>{
  const t = e.target.closest('[data-tab]'); if(t) switchTab(t.dataset.tab);
});

function renderSetup(){
  const p = preset();
  const state = configured()
    ? `<div class="keystate good">Key saved in this browser. Other devices need it pasted again.</div>`
    : `<div class="keystate warnk">No key yet. Coach is offline.</div>`;

  $('#tab-setup').innerHTML = `
    ${state}
    <label><span class="lb">Provider</span>
      <select id="ai-provider">${Object.entries(PRESETS).map(([k,v])=>`<option value="${k}" ${S.ai.provider===k?'selected':''}>${v.label}</option>`).join('')}</select>
    </label>
    <label><span class="lb">Model</span>
      ${p.models
        ? `<select id="ai-model">${p.models.map(m=>`<option ${S.ai.model===m?'selected':''}>${m}</option>`).join('')}</select>`
        : `<input id="ai-model" value="${esc(S.ai.model)}">`}
    </label>
    <label><span class="lb">Endpoint</span><input id="ai-endpoint" value="${esc(S.ai.endpoint)}"></label>
    ${p.needsKey?`<label><span class="lb">API key</span><input id="ai-key" type="password" value="${esc(S.ai.key)}" placeholder="AIza..."></label>`:''}
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="mini solid" id="ai-save">Save</button>
      <button class="mini" id="ai-test">Test</button>
      <button class="mini ghost" id="ai-clear">Clear chat</button>
    </div>
    ${p.keyUrl?`<p class="fine">Free key: <a href="${p.keyUrl}" target="_blank" rel="noopener">aistudio.google.com/apikey</a>.</p>`:''}
    <p class="fine">For personal/local use, the key is stored only in this browser. For a public deployment, use the proxy below so the key is not exposed to visitors.</p>
    <details><summary>HTTP proxy for standard Gemini (not Live)</summary><pre>${esc(WORKER)}</pre>
    <button class="mini" id="copy-worker" style="margin-top:8px">Copy worker code</button></details>`;

  $('#ai-provider').onchange = e=>{
    const k = e.target.value, pr = PRESETS[k];
    S.ai = {...S.ai, provider:k, endpoint:pr.endpoint, model:pr.model, baked:false};
    save('ai',S.ai); renderSetup();
  };
  $('#ai-save').onclick = ()=>{
    S.ai.endpoint = $('#ai-endpoint').value.trim();
    S.ai.model = normalizeGeminiModel($('#ai-model').value);
    if($('#ai-key')) S.ai.key = $('#ai-key').value.trim();
    save('ai',S.ai); toast('Coach armed','ok'); switchTab('chat'); renderChat();
  };
  $('#ai-test').onclick = async ()=>{
    $('#ai-save').click();
    toast('Pinging the model...');
    try{ await callModel([{role:'system',content:'Reply with exactly: ready'},{role:'user',content:'ping'}], ()=>{}); toast(`${S.ai.model} responded. Coach is live.`,'ok'); }
    catch(err){ toast(String(err.message||err).slice(0,110),'bad'); }
  };
  $('#ai-clear').onclick = ()=>{ S.chat=[]; save('chat',[]); renderChat(); toast('Chat cleared'); };
  $('#copy-worker').onclick = ()=>{ navigator.clipboard?.writeText(WORKER); toast('Copied','ok'); };
}

const WORKER = `// worker.js — Cloudflare Worker proxy; set GEMINI_API_KEY as a secret
export default {
  async fetch(req, env) {
    const cors = {
      "access-control-allow-origin": "*",
      "access-control-allow-headers": "content-type",
      "access-control-allow-methods": "POST,OPTIONS"
    };
    if (req.method === "OPTIONS") return new Response(null, { headers: cors });
    if (req.method !== "POST") return new Response("Method not allowed", { status: 405, headers: cors });
    if (!env.GEMINI_API_KEY) return new Response("Missing GEMINI_API_KEY secret", { status: 500, headers: cors });

    let body;
    try { body = await req.json(); }
    catch { return new Response("Invalid JSON", { status: 400, headers: cors }); }

    body.model = new URL(req.url).searchParams.get("model") || body.model || "gemini-3.6-flash";
    body.store = false;

    const up = await fetch("https://generativelanguage.googleapis.com/v1beta/interactions", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-goog-api-key": env.GEMINI_API_KEY
      },
      body: JSON.stringify(body)
    });
    return new Response(up.body, {
      status: up.status,
      headers: { ...cors, "content-type": up.headers.get("content-type") || "application/json" }
    });
  }
}`;

};

$('#btn-sample').onclick = ()=>{
  if(S.sessions.length && !confirm('This adds 6 weeks of sample history on top of your data. Continue?')) return;
  const plan = [['a',0],['c',2],['b',4]];
  for(let w=6; w>=1; w--){
    plan.forEach(([day,off])=>{
      const date = iso(new Date(Date.now() - ((w*7)-off)*86400000));
      let vol=0, sets=0, reps=0;
      allItems(day).forEach((it,idx)=>{
        if(idx>5) return;
        const base = 12 + idx*4 + (6-w)*1.5;
        const arr = Array.from({length:it.sets},()=>({w:round1(base+Math.random()*2), r:8+Math.floor(Math.random()*4)}));
        (S.log[it.id] ||= []).push({date, sets:arr});
        arr.forEach(s=>{ vol += s.w*s.r; sets++; reps += s.r;
          const e = e1rm(s.w,s.r);
          if(!S.prs[it.id] || e > S.prs[it.id].e1rm) S.prs[it.id] = {w:s.w,r:s.r,e1rm:round1(e),date,name:it.name};
        });
      });
      S.sessions.push({date, day, vol:Math.round(vol), sets, reps, mins:52+Math.floor(Math.random()*20), notes: w===1&&day==='a' ? 'Right shoulder tight on the second press set. Sleep was bad.' : ''});
    });
  }
  S.sessions.sort((a,b)=>a.date.localeCompare(b.date));
  save('log',S.log); save('sessions',S.sessions); save('prs',S.prs);
  renderAll(); toast('Six weeks of sample history loaded','ok');
};

}

function renderAll(){
  const next = renderMeta();
  if(!S._picked){ S.day = next; S._picked = true; }
  renderHeat(); renderDay(); renderRecords(); renderChat();
}
renderAll();
switchTab('chat');
